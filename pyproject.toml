[project]
name = "webrouter-workshop"
version = "0.1.0"
description = "AI Dev NYC workshop: give your agent a web router"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12",
    "webrouter[search,extract]==0.14.0",
]

# Only for organizers/tests (the budgeted-MCP check); attendees never install it:
#   uv run --group organizers python -m unittest discover -s organizers/tests
[dependency-groups]
organizers = ["webrouter[mcp]==0.14.0"]

[tool.uv]
package = false
